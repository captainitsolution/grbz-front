<section id="localizacao" class="section location">
  <div class="container">
    <app-section-heading eyebrow="Onde estamos" title="Nossa localização" />

    <div class="location__layout">
      <address class="location__card">
        <app-icon class="location__pin" name="map-pin" />
        <p class="location__street">{{ address.street }}</p>
        <p>{{ address.district }}</p>
        <p>{{ address.city }} - {{ address.state }}</p>
        <p>CEP {{ address.zipCode }}</p>
        <a class="btn btn--brand location__cta" [href]="directionsUrl" target="_blank" rel="noopener noreferrer">
          Como chegar
          <app-icon name="arrow-right" />
        </a>
      </address>

      <iframe
        class="location__map"
        title="Mapa com a localização do escritório"
        [src]="mapEmbedUrl"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        allowfullscreen
      ></iframe>
    </div>
  </div>
</section>
