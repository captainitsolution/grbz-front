<section id="contato" class="section contact">
  <div class="container">
    <app-section-heading eyebrow="Fale conosco" title="Entre em contato" tone="on-dark">
      Conte-nos sobre o seu caso. Retornaremos o mais breve possível.
    </app-section-heading>

    <ul class="contact__grid">
      @for (channel of channels; track channel.label) {
        <li>
          <a
            class="contact__card"
            [href]="channel.href"
            [attr.target]="channel.opensInNewTab ? '_blank' : null"
            [attr.rel]="channel.opensInNewTab ? 'noopener noreferrer' : null"
          >
            <app-icon class="contact__icon" [name]="channel.icon" />
            <span class="contact__label">{{ channel.label }}</span>
            <span class="contact__value">{{ channel.value }}</span>
          </a>
        </li>
      }
    </ul>
  </div>
</section>
